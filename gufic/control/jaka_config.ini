# Jaka Robot Controller Configuration
# 机械臂控制器配置文件

# 机械臂连接参数
[robot]
ip_address = 192.168.125.3
port = 10000
timeout = 5.0

# 控制参数
[control]
frequency = 125  # Hz
max_time = 10.0  # seconds
task_type = sphere  # regulation, circle, line, sphere

# 力控制参数
[force_control]
desired_fz = 10.0  # N
kp_force = 1.0
ki_force = 0.1
kd_force = 0.05
force_saturation = 50.0

# 位置控制参数
[position_control]
kp_position = [400, 400, 400]
kp_orientation = [50, 25, 5] 
kd_damping = [5, 5, 5, 3, 2, 1]

# 安全参数
[safety]
max_joint_velocity = 1.0  # rad/s
max_joint_acceleration = 2.0  # rad/s^2
emergency_stop_force = 100.0  # N

# 滤波器参数
[filter]
force_cutoff_freq = 10.0  # Hz
position_cutoff_freq = 5.0  # Hz
filter_order = 5

# 日志参数
[logging]
enable_logging = true
log_directory = ./log
log_joint_states = true
log_force_data = true
log_trajectory = true